<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Terminal...</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
        }

        /* خلفية الأرقام (101010) شغال في الخلفية بوضوح */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #terminal {
            font-size: 19px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            white-space: pre-line;
            line-height: 1.7;
            position: relative;
            z-index: 2;
        }

        /* مؤشر الكتابة الوامض زي التيرموكس الحقيقي */
        .cursor {
            display: inline-block;
            background-color: #00ff00;
            width: 10px;
            height: 20px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-right: 5px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .joke {
            color: #ff0055;
            font-size: 35px;
            text-align: center;
            margin-top: 30vh;
            text-shadow: 0 0 20px #ff0055;
            display: none;
            direction: ltr;
            z-index: 2;
            position: relative;
        }
    </style>
</head>
<body>

    <!-- خلفية الأرقام الثنائية 1010 -->
    <canvas id="matrix"></canvas>

    <div id="terminal"><span id="text-output"></span><span class="cursor"></span></div>
    <div id="finalMessage" class="joke">Hacking Successful. System Compromised. 💀</div>

    <script>
        // 1. تشغيل خلفية الأرقام النازلة (Matrix Rain) بوضوح
        const canvas = document.getElementById("matrix");
        const ctx = canvas.getContext("2d");

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const numbers = "101010101010101010101010101010";
        const alphabet = numbers.split("");
        const font_size = 18;
        const columns = canvas.width / font_size;
        const drops = [];

        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            // تأثير الشفافية البسيط عشان يترك أثر ورا الأرقام
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00FF66"; // لون أخضر فاقع وجميل
            ctx.font = font_size + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * font_size, drops[i] * font_size);
                if (drops[i] * font_size > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // 2. رسائل المقلب اللي هتتكتب حرف بحرف (تأثير تجميع الكلام)
        const messages = [
            "جارٍ الاتصال بالخادم الرئيسي عن بُعد...",
            "جاري تخطي الجدار الناري (Firewall)...",
            "تم اختراق النظام بنجاح 🟢...",
            "جاري فحص الذاكرة العشوائية (RAM)...",
            "تم العثور على ملفات الحسابات وكلمات المرور 🔑...",
            "جاري سحب الصور الشخصية والاستوديو 📸...",
            "تم تحميل 142 صورة بنجاح...",
            "جاري سحب جهات الاتصال ورسائل واتساب 📱...",
            "جارٍ تشفير الملفات لمنع الاسترجاع (Ransomware Mode)...",
            "جاري الاتصال بالسيرفر الخارجي للرفع...",
            "جاري إرسال البيانات (54% مكتمل)...",
            "جاري إرسال البيانات (89% مكتمل)...",
            "جاري إرسال البيانات (100% تم بنجاح)...",
            "جارٍ فرمتة النظام الأساسي للجهاز 💀...",
            "عملية الاختراق اكتملت بنجاح تام...",
            "ستنفجر برودة الهاتف خلال:",
            "3...",
            "2...",
            "1...",
            "🌋 BOOM!"
        ];

        let msgIndex = 0;
        let charIndex = 0;
        let outputDiv = document.getElementById("text-output");
        let terminalContainer = document.getElementById("terminal");
        let finalMsg = document.getElementById("finalMessage");

        function typeWriter() {
            if (msgIndex < messages.length) {
                let currentMessage = messages[msgIndex];
                
                if (charIndex < currentMessage.length) {
                    outputDiv.innerHTML += currentMessage.charAt(charIndex);
                    charIndex++;
                    // سرعة كتابة كل حرف (سرعة الهاكرز)
                    setTimeout(typeWriter, 35); 
                } else {
                    // لما الجملة تخلص، ننزل سطر جديد ونستعد للجملة اللي بعدها
                    outputDiv.innerHTML += "\n";
                    msgIndex++;
                    charIndex = 0;
                    // وقفة قصيرة بين كل جملة والتانية
                    setTimeout(typeWriter, 800);
                }
            } else {
                // لما كل الرسائل تخلص، نخفي الشاشة ونظهر رسالة النهاية
                setTimeout(() => {
                    terminalContainer.style.display = "none";
                    finalMsg.style.display = "block";
                }, 1500);
            }
        }

        // بدء تأثير التيرموكس بعد ثانية واحدة
        setTimeout(typeWriter, 1000);
    </script>
</body>
</html>
