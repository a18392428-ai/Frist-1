<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخزين الملفات السحابي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="upload-container">
        <!-- شريط تغيير الخلفية العلوي -->
        <div class="bg-picker-box">
            <span>🖼️ خلفية الشاشة</span>
            <div>
                <input type="file" id="bgInput" accept="image/*" style="display: none;">
                <button type="button" class="btn-bg" onclick="document.getElementById('bgInput').click()">تغيير</button>
                <button type="button" id="resetBgBtn" class="btn-bg-reset">إعادة الافتراضي</button>
            </div>
        </div>

        <div>
            <h1>تخزين الملفات السحابي</h1>
            <p>اختر الملفات لحفظها في ذاكرة المتصفح</p>

            <!-- نموذج رفع الملفات -->
            <form id="uploadForm">
                <input type="file" id="fileInput" multiple required>
                <button type="submit">⬆️ رفع الملف الآن</button>
            </form>
        </div>

        <!-- أزرار إدارة الملفات والربط السحابي -->
        <div>
            <div class="actions-group">
                <button type="button" class="btn-download-all" id="downloadAllBtn">📦 تحميل الكل (ZIP)</button>
                <button type="button" class="btn-delete-all" id="deleteAllBtn">🗑️ حذف الكل</button>
            </div>

            <!-- زر جوجل درايف الجديد -->
            <div style="margin-bottom: 10px;">
                <button type="button" id="driveSyncBtn" class="btn-drive" style="width: 100%;">☁️ حفظ نسخة على Google Drive</button>
            </div>

            <hr>

            <!-- قائمة الملفات -->
            <ul id="fileList"></ul>
        </div>
    </div>

    <!-- مكتبات مساعدة (JSZip & FileSaver) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- مكتبة Google API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script src="script.js"></script>
</body>
</html>
