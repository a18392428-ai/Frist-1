<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخزين الملفات المحلي</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبات ضغط وتنزيل كل الملفات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <div class="upload-container">
        
        <!-- قسم اختيار الخلفية المخصص -->
        <div class="bg-picker-box">
            <span>🖼️ خلفية الصفحة:</span>
            <input type="file" id="bgInput" accept="image/*" style="display: none;">
            <button type="button" class="btn-bg" onclick="document.getElementById('bgInput').click()">تغيير الصورة</button>
            <button type="button" id="resetBgBtn" class="btn-bg-reset">إعادة الافتراضي</button>
        </div>

        <h1>تخزين الملفات السحابي (محلي)</h1>
        <p>اختر الملفات لحفظها في ذاكرة المتصفح واسترجاعها بأي وقت</p>

        <form id="uploadForm">
            <input type="file" id="fileInput" required>
            <button type="submit">رفع الملف الآن</button>
        </form>

        <hr>

        <h2>ملفاتي المرفوعة</h2>
        
        <div class="actions-group">
            <button id="downloadAllBtn" class="btn-download-all">📦 تحميل كل الملفات (ZIP)</button>
            <button id="deleteAllBtn" class="btn-delete-all">🗑️ حذف جميع الملفات</button>
        </div>

        <ul id="fileList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
